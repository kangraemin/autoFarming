<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Idle Tower Defense</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Stage Select Screen -->
  <div id="stage-select" class="stage-select-screen hidden">
    <div class="stage-select-content">
      <div class="stage-select-header">
        <h1 class="stage-select-title">⚔️ Tower Defense</h1>
        <p class="stage-select-sub">스테이지를 선택하세요</p>
      </div>
      <div id="stage-grid" class="stage-grid"></div>
    </div>
  </div>

  <div id="app">
    <div class="top-bar">
      <div class="stat">💰 <span id="gold">100</span></div>
      <div class="stat">🌊 Wave <span id="wave">1</span></div>
      <div class="stat">❤️ <span id="lives">20</span></div>
      <div class="stat">⭐ <span id="score">0</span></div>
      <div class="stat stage-stat"><span id="stage-label">-</span></div>
      <button id="stage-select-btn" class="stage-select-top-btn" title="스테이지 선택">⚔️</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div class="bottom-panel">
      <!-- Soul Inventory Bar -->
      <div class="soul-bar">
        <span class="soul-bar-label">🔮 소울</span>
        <div id="soul-inventory" class="soul-inventory">
          <span class="soul-empty">소울을 모아 타워를 합성하세요!</span>
        </div>
        <button id="codex-btn" class="codex-btn" title="합성 도감">📖 도감</button>
      </div>

      <!-- Active Skills Bar -->
      <div class="skills-bar" id="skills-bar">
        <span class="skills-label">⚡ 스킬</span>
        <button id="skill-btn-airstrike" class="skill-btn ready" data-skill="airstrike" title="폭격 — 범위 폭격 (쿨다운 20s)">
          <span class="skill-icon">💥</span>
          <span class="skill-name">폭격</span>
          <div class="skill-cd-overlay"></div>
          <span class="skill-cd-text"></span>
        </button>
        <button id="skill-btn-freeze" class="skill-btn ready" data-skill="freeze" title="동결 — 전체 슬로우 4초 (쿨다운 25s)">
          <span class="skill-icon">❄️</span>
          <span class="skill-name">동결</span>
          <div class="skill-cd-overlay"></div>
          <span class="skill-cd-text"></span>
        </button>
        <button id="skill-btn-heal" class="skill-btn ready" data-skill="heal" title="치유 — 체력 +3 (쿨다운 30s)">
          <span class="skill-icon">💚</span>
          <span class="skill-name">치유</span>
          <div class="skill-cd-overlay"></div>
          <span class="skill-cd-text"></span>
        </button>
      </div>

      <div class="tower-shop" id="tower-shop">
        <button class="tower-btn selected" data-tower="arrow" data-cost="50">
          <span class="tower-icon">🏹</span>
          <span class="tower-name">Arrow</span>
          <span class="tower-cost">50g</span>
        </button>
        <button class="tower-btn" data-tower="cannon" data-cost="100">
          <span class="tower-icon">💣</span>
          <span class="tower-name">Cannon</span>
          <span class="tower-cost">100g</span>
        </button>
        <button class="tower-btn" data-tower="ice" data-cost="75">
          <span class="tower-icon">❄️</span>
          <span class="tower-name">Ice</span>
          <span class="tower-cost">75g</span>
        </button>
        <button class="tower-btn" data-tower="lightning" data-cost="150">
          <span class="tower-icon">⚡</span>
          <span class="tower-name">Lightning</span>
          <span class="tower-cost">150g</span>
        </button>
      </div>
      <div class="controls">
        <button id="start-wave-btn" class="action-btn">▶ Start Wave</button>
        <button id="speed-btn" class="action-btn">⏩ 1x</button>
      </div>
    </div>

    <!-- Tower upgrade popup -->
    <div id="upgrade-popup" class="popup hidden">
      <div class="popup-content">
        <h3 id="popup-title">Tower</h3>
        <p id="popup-stats"></p>
        <div id="fusion-options" class="fusion-options" style="display:none"></div>
        <button id="upgrade-btn" class="action-btn">⬆ Upgrade</button>
        <button id="sell-btn" class="action-btn sell">🗑 Sell</button>
        <button id="close-popup" class="action-btn">✕</button>
      </div>
    </div>

    <!-- Codex modal -->
    <div id="codex-modal" class="popup hidden">
      <div class="popup-content codex-content">
        <h3>📖 합성 도감 <span id="codex-count" style="font-size:13px;color:#aaa">0 / 10</span></h3>
        <div id="codex-list" class="codex-list"></div>
        <button id="codex-close" class="action-btn" style="margin-top:12px">닫기</button>
      </div>
    </div>

    <!-- Game over / wave clear -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn" class="action-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/soul.js"></script>
  <script src="js/fusion.js"></script>
  <script src="js/path.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/wave.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
